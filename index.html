<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Oi Bolota</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
    }
    h1 {
      font-size: 4rem;
      animation: rgb 3s infinite;
    }
    @keyframes rgb {
      0% { color: rgb(255, 0, 0); }
      33% { color: rgb(0, 255, 0); }
      66% { color: rgb(0, 0, 255); }
      100% { color: rgb(255, 0, 0); }
    }
  </style>
</head>
<body>
  <h1>Oi Bolota</h1>
</body>
</html>
